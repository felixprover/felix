resolver: lts-24.54

# Keep optimization a Cabal build setting, shared by all Felix components.
# A fresh directory also avoids reusing older builds with ad hoc -O flags.
work-dir: .stack-work-o2
configure-options:
    $locals:
        - --enable-optimization=2

# Put documentation into an easily accessible directory.
build:
    haddock-arguments:
        haddock-args:
        - "--odir=./haddocks"
